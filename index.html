<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="one candle">
<meta name="description" content="one candle — 電気を消して、キャンドルをひとつ。世界の部屋に灯して、ながめるだけ。広告なし。">
<title>one candle</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta property="og:title" content="one candle">
<meta property="og:description" content="電気を消して、キャンドルをひとつ。">
<meta property="og:image" content="https://roguepink.github.io/kyandoru/icons/ogp.jpg">
<meta property="og:url" content="https://roguepink.github.io/kyandoru/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Shippori+Mincho:wght@500&display=swap">
<style>
  html, body { background: #000; }
</style>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="scene" class="scene" aria-hidden="true"></div>

<!-- はじめの名前(たて書き) -->
<div id="title" class="title" aria-hidden="true">one candle</div>
<p id="hint" class="hint" role="status"></p>
<button id="relight" class="relight" hidden>もう一度ともす</button>
<p id="toast" class="toast" aria-live="polite"></p>

<!-- 操作の部品(ふだんは かくれている) -->
<div id="ui" class="ui" aria-hidden="true">
  <div id="drawer" class="drawer">
    <!-- ろうそくを選ぶ -->
    <section id="pick" class="sheet" hidden aria-label="キャンドルを選ぶ">
      <h2 class="head">Candle <small>キャンドル</small></h2>
      <div id="thumbs" class="thumbs"></div>
      <p id="swipeNote" class="note small" hidden>左右にはらっても、キャンドルが変わります。</p>
    </section>


    <!-- おやすみ(タイマー) -->
    <section id="sleep" class="sheet" hidden aria-label="おやすみ">
      <h2 class="head">Sleep <small>おやすみ</small></h2>
      <p class="note">時間がくると、灯がゆっくり小さくなって消えます。</p>
      <div class="choices wrap" id="sleepChoices"></div>
    </section>

    <!-- 音楽 -->
    <section id="music" class="sheet" hidden aria-label="音楽">
      <h2 class="head">Music <small>音楽</small></h2>
      <div class="row"><button id="mplay" class="big">流す</button></div>
      <div class="row"><span class="lab">音の大きさ</span><input id="vol" type="range" min="0" max="100" step="1" aria-label="音の大きさ"></div>
      <div class="row"><span class="lab">曲の順番</span><div class="choices" id="orderChoices"></div></div>
      <ol id="tracks" class="tracks"></ol>
    </section>

    <!-- ととのえる -->
    <section id="adjust" class="sheet" hidden aria-label="あかり">
      <h2 class="head">Light <small>あかり</small></h2>
      <div class="row"><span class="lab">炎の大きさ</span><div class="choices" id="sizeChoices"></div></div>
      <div class="row"><span class="lab">明るさ</span><div class="choices dots" id="brightChoices"></div></div>
      <div class="row"><span class="lab">色あい</span><div class="choices" id="warmChoices"></div></div>
      <div class="row end">
        <button id="out" class="link">灯を消す</button>
        <button id="fs" class="link" hidden>画面いっぱいにする</button>
      </div>
      <p id="lineNote" class="note" hidden>LINEの中ではなく、ブラウザで開くと、画面が消えずにずっと表示できます。</p>
      <p id="wakeNote" class="note" hidden>しばらくすると画面が消えるときは、スマホの「自動ロック」を長めにしてください。</p>
      <p id="installNote" class="note"></p>
      <p class="credit">one candle ・ ROGUE PINK</p>
    </section>
  </div>

  <nav id="bar" class="bar" aria-label="操作">
    <button data-open="pick" aria-label="キャンドル"><svg viewBox="0 0 24 24"><path d="M12 3.2c1.5 1.9 2.1 3.2 2.1 4.2a2.1 2.1 0 0 1-4.2 0c0-1 .6-2.3 2.1-4.2Z"/><path d="M8.5 11.5h7v9h-7z"/><path d="M12 9.6v1.9"/></svg><b>Candle</b><span>キャンドル</span></button>
    <button id="musicBtn" data-open="music" aria-label="音楽" hidden><svg viewBox="0 0 24 24"><path d="M9 18.5V6l10-2v12"/><circle cx="6.5" cy="18.5" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg><b>Music</b><span id="musicLab">音楽</span></button>
    <button data-open="sleep" aria-label="おやすみ"><svg viewBox="0 0 24 24"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10Z"/></svg><b>Sleep</b><span id="sleepLab">おやすみ</span></button>
    <button data-open="adjust" aria-label="あかり"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.6"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M5.6 18.4l1.6-1.6M16.8 7.2l1.6-1.6"/></svg><b>Light</b><span>あかり</span></button>
  </nav>
</div>

<script>
  // はじめの画面(Google Play 風: インストール / このまま見る)。install.js が出す。
  // shield: はじめの画面にふれても うしろの灯りは反応しない(「このまま見る」を押したときだけ、そのタップで灯る)
  window.INSTALL_GATE = {
    id: 'kyandoru', name: 'one candle', icon: 'icons/icon-192.png', color: '#a8692e', shield: true, lang: 'en',
    tagline: 'Light one candle, and just watch',
    badges: ['Free', 'No ads', 'No sign-up'],
    shots: ['shots/1.jpg', 'shots/2.jpg', 'shots/3.jpg', 'shots/4.jpg'],
    desc: 'Turn off the lights and light a single candle. Watch candles glow in rooms around the world, from Denmark and Paris to Morocco. The flames flicker just like the real thing.',
    points: ['21 candles: pillars, brass candlesticks, lanterns, even a seashell', '10 gentle lullabies, sung in the languages of each country', 'A sleep timer lets the flame fade out quietly'],
    playLabel: '▶ Watch'
  };
</script>
<script src="install.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
